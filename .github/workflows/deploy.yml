name: Deploy KOLD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kold-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          KOLD_DEPLOY_SSH_KEY: ${{ secrets.KOLD_DEPLOY_SSH_KEY }}
          KOLD_DEPLOY_HOST: ${{ secrets.KOLD_DEPLOY_HOST }}
        run: |
          test -n "$KOLD_DEPLOY_SSH_KEY"
          test -n "$KOLD_DEPLOY_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$KOLD_DEPLOY_SSH_KEY" > ~/.ssh/kold_deploy
          chmod 600 ~/.ssh/kold_deploy
          ssh-keyscan -H "$KOLD_DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Backup production and enable maintenance mode
        env:
          KOLD_DEPLOY_HOST: ${{ secrets.KOLD_DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/kold_deploy -o IdentitiesOnly=yes "root@${KOLD_DEPLOY_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          stamp=$(date +%Y%m%d-%H%M%S)
          backup="/var/backups/kold/$stamp"
          mkdir -p "$backup"
          cp /var/www/kold/database/database.sqlite "$backup/database.sqlite"
          cp /var/www/kold/.env "$backup/.env"
          tar --exclude=vendor --exclude=node_modules --exclude=storage/logs --exclude=storage/framework --exclude=database/database.sqlite -czf "$backup/app.tar.gz" -C /var/www/kold .
          cd /var/www/kold
          php artisan down --retry=60
          echo "Backup created at $backup"
          EOF

      - name: Rsync application
        env:
          KOLD_DEPLOY_HOST: ${{ secrets.KOLD_DEPLOY_HOST }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='database/database.sqlite' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/down' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='IGFB-Test.html' \
            --exclude='test.php' \
            --exclude='.DS_Store' \
            -e 'ssh -i ~/.ssh/kold_deploy -o IdentitiesOnly=yes' \
            ./ "root@${KOLD_DEPLOY_HOST}:/var/www/kold/"

      - name: Install and refresh Laravel
        env:
          KOLD_DEPLOY_HOST: ${{ secrets.KOLD_DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/kold_deploy -o IdentitiesOnly=yes "root@${KOLD_DEPLOY_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /var/www/kold
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs bootstrap/cache
          chown -R www-data:www-data storage bootstrap/cache database
          php artisan up
          echo DEPLOY_OK
          EOF

      - name: Smoke check
        run: |
          curl -fsSL -o /dev/null -w "%{http_code}\n" https://kold.tedku.cloud/
          curl -fsSL https://kold.tedku.cloud/ | grep -q 'KOLD'
